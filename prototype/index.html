<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>像素小屋</title>
  <meta name="description" content="一个可以点来点去的像素小房间：工作、项目、经历和照片背后的故事。">
  <meta property="og:title" content="像素小屋">
  <meta property="og:image" content="assets/memories/pixel-room-origin.jpg">
  <link rel="preload" href="assets/fonts/fusion-pixel-12px-zh_hans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="is-loading">
    <header id="hud">
      <span class="hud-title">像素小屋</span>
      <nav class="hud-btns" aria-label="工具栏">
        <button type="button" class="px-btn ghost small" data-hud="quick"></button>
        <button type="button" class="px-btn ghost small" data-hud="list"></button>
        <button type="button" class="px-btn ghost small" data-hud="album"></button>
        <button type="button" class="px-btn ghost small" data-hud="sound" aria-pressed="false"></button>
        <button type="button" class="px-btn ghost small" data-hud="lang"></button>
      </nav>
    </header>

    <main id="viewport">
      <div id="stage">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div id="hotspots" role="group"></div>
      </div>
    </main>

    <div id="ui-layer"></div>
    <div id="modal-root"></div>
    <div id="pan-hint" hidden></div>
    <div id="sr-live" class="sr-only" aria-live="polite"></div>

    <div id="loading" role="status">
      <div class="loading-box">
        <p class="loading-text">正在整理房间…</p>
        <div class="bar"><span></span></div>
        <p class="loading-tip"></p>
      </div>
    </div>
  </div>

  <noscript>
    <p style="color:#fbcda6;font-family:sans-serif;padding:24px">这个页面需要 JavaScript。This page needs JavaScript.</p>
  </noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
